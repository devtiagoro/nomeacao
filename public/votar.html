<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Votar — Nomeia</title>
    <meta name="description" content="Votação de cargos da reunião" />
    <meta name="theme-color" content="#0f4c5c" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/votar.css" />
    <script type="module" src="js/votar.js"></script>
  </head>
  <body class="page-vote">
    <header class="app-header vote-header">
      <div class="vote-header-main">
        <a class="brand-mark" href="index.html" aria-label="Nomeia — início"><span data-icon="check"></span></a>
        <div class="vote-header-text">
          <span class="eyebrow">Nomeia · Votação</span>
          <h1 id="meeting-name" class="vote-meeting">Carregando…</h1>
        </div>
      </div>
      <span id="conn" class="chip connecting" role="status">Conectando…</span>
    </header>

    <main id="main" class="vote-main" tabindex="-1">
      <div id="flash" role="alert"></div>
      <div id="office-area" class="office-area">
        <div class="vote-skeleton" aria-busy="true">
          <span class="skeleton sk-title"></span>
          <span class="skeleton sk-block"></span>
          <span class="skeleton sk-block"></span>
        </div>
      </div>
      <p id="turnout" class="turnout-line"></p>
    </main>
  </body>
</html>
