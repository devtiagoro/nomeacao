<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Votar — Nomeia</title>
    <meta name="description" content="Votação de cargos da reunião" />
    <meta name="theme-color" content="#0f4c5c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nomeia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/votar.css" />
    <script type="module" src="js/votar.js"></script>
  </head>
  <body class="page-vote">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <header class="app-header vote-header">
      <div class="vote-header-main">
        <a class="brand-mark" href="index.html" aria-label="Nomeia — início"><span data-icon="check"></span></a>
        <div class="vote-header-text">
          <span class="eyebrow">Nomeia · Reunião</span>
          <h1 id="meeting-name" class="vote-meeting">Carregando…</h1>
        </div>
      </div>
      <span id="conn" class="chip connecting" role="status">Conectando…</span>
    </header>

    <main id="main" class="vote-main" tabindex="-1">
      <section id="view-loading" class="vote-skeleton" aria-busy="true" aria-label="Carregando a reunião">
        <span class="skeleton sk-line sk-w-40"></span>
        <span class="skeleton sk-title"></span>
        <span class="skeleton sk-block"></span>
        <span class="skeleton sk-block"></span>
        <span class="skeleton sk-block"></span>
        <p class="sr-only">Carregando a reunião…</p>
      </section>

      <section id="view-error" class="card" hidden>
        <div class="empty">
          <div class="empty-icon"><span data-icon="alert"></span></div>
          <p class="empty-title">Não foi possível abrir a reunião</p>
          <p id="error-text" class="empty-text" role="alert"></p>
          <a class="btn btn-secondary" href="index.html"><span data-icon="arrow-left"></span>Voltar ao início</a>
        </div>
      </section>

      <section id="view-main" hidden>
        <div id="flash" role="alert"></div>
        <div id="office-area" class="office-area"></div>
        <p id="turnout" class="turnout-line" aria-live="off"></p>
      </section>
    </main>

    <dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
      <div class="modal-icon"><span data-icon="ballot"></span></div>
      <h2 id="confirm-title" class="modal-title">Confirmar voto</h2>
      <p id="confirm-desc" class="modal-text">Você escolheu:</p>
      <p id="confirm-choice" class="confirm-choice"></p>
      <p class="modal-text">Ao confirmar, o voto é registrado e entra imediatamente na contagem.</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-secondary" type="button">Voltar</button>
        <button id="confirm-btn" class="btn btn-primary" type="button">Confirmar voto</button>
      </div>
    </dialog>
  </body>
</html>
