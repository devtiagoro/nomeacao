<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Apresentação — Nomeia</title>
    <meta name="theme-color" content="#052029" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/apresentacao.css" />
    <script type="module" src="js/apresentacao.js"></script>
  </head>
  <body class="page-stage">
    <div id="stage" class="stage" data-view="loading">
      <header class="stage-header">
        <div class="stage-brand">
          <span class="brand-mark"><span data-icon="check"></span></span>
          <span class="stage-brand-name">Nomeia</span>
          <span class="stage-sep" aria-hidden="true"></span>
          <h1 id="meeting-name" class="stage-meeting"></h1>
        </div>
        <div class="row">
          <span id="conn" class="chip connecting" role="status">Conectando…</span>
          <button id="fullscreen" class="btn btn-sm stage-btn" type="button" aria-label="Alternar tela cheia">
            <span data-icon="maximize"></span><span class="label">Tela cheia</span>
          </button>
        </div>
      </header>

      <main id="main" class="stage-main">
        <section class="stage-content" aria-labelledby="office-title">
          <div id="office-status" class="stage-kicker"></div>
          <h2 id="office-title" class="stage-title"><span class="skeleton sk-title"></span></h2>
          <p id="office-desc" class="stage-desc"></p>
          <p id="status-line" class="stage-status" aria-live="polite"></p>
          <div id="candidates"></div>
          <div id="results" aria-live="polite"></div>
        </section>

        <aside class="stage-aside" aria-label="Acesso e participação">
          <section id="qr-card" class="stage-card qr-card" aria-labelledby="qr-title">
            <h2 id="qr-title"><span data-icon="qr"></span>Vote pelo celular</h2>
            <div class="qr-frame">
              <img id="qr" alt="QR Code da votação" width="280" height="280" />
            </div>
            <p id="public-link" class="stage-link mono"></p>
            <p class="stage-note">Sem cadastro. A tela do celular acompanha todos os cargos.</p>
          </section>

          <section id="turnout-card" class="stage-card" aria-labelledby="turnout-title">
            <h2 id="turnout-title"><span data-icon="ballot"></span>Votação</h2>
            <div class="stage-stats">
              <div>
                <span class="stage-stat-value" id="t-voted">0</span>
                <span class="stage-stat-label">votos registrados</span>
              </div>
              <div class="stage-stat-pending">
                <span class="stage-stat-value" id="t-expected">0</span>
                <span class="stage-stat-label">pessoas presentes</span>
              </div>
            </div>
          </section>
        </aside>
      </main>
    </div>
  </body>
</html>
