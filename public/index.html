<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NOMEIA — Nomeações e votações</title>
    <meta name="description" content="Nomeações e votações de cargos em reuniões presenciais" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NOMEIA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/index.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <header class="app-header">
      <span class="brand">NOMEIA</span>
    </header>
    <main id="main" class="container narrow stack" tabindex="-1">
      <h1>Nomeações e votações</h1>
      <p class="muted">Participe da votação da sua reunião pelo celular.</p>

      <section id="continue" class="card stack" hidden aria-labelledby="continue-title">
        <h2 id="continue-title">Reunião vinculada a este aparelho</h2>
        <a id="continue-link" class="btn btn-primary btn-lg btn-block" href="/votar.html">Abrir reunião</a>
      </section>

      <section class="card stack" aria-labelledby="code-title">
        <h2 id="code-title">Tenho um cartão de credencial</h2>
        <p class="small muted">Leia o QR Code do cartão com a câmera ou digite o código impresso.</p>
        <form id="code-form" novalidate>
          <div class="field">
            <label for="code">Código da credencial</label>
            <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
              placeholder="XXXX-XXXX-XXXX" maxlength="20" required />
          </div>
          <p id="code-error" class="banner error" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>
      </section>

      <p class="small"><a href="/admin.html">Área da administração</a></p>
    </main>
  </body>
</html>
